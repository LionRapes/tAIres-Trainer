[project]
name = "taires"
version = "0.0.1"
description = "A platform for training and evaluating neural networks for semantic text matching"
requires-python = ">3.14.1,<4"
authors = [
    { name = "Eldar, Amir and Emir" }
]
license = "MIT"
dependencies = [
    "transformers>=4.36.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "accelerate>=0.26.0",
    "scipy (>=1.18.1,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "streamlit (>=1.64.0,<2.0.0)",
    "plotly (>=7.1.0,<8.0.0)",
    "boto3 (>=1.43.99,<2.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
torch = { version = ">=2.0.0", source = "pytorch" }
torchvision = { version = ">=0.15.0", source = "pytorch" }
torchaudio = { version = ">=0.15.0", source = "pytorch" }

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
ignore = [
    "E501",
    "B008",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
[dependency-groups]
dev = [
    "ruff (>=0.16.8,<0.17.0)"
]
