[project]
name = "taires"
version = "0.0.1"
description = "A platform for training and evaluating neural networks for semantic text matching"
requires-python = ">=3.12,<4"
authors = [
    { name = "Eldar, Amir and Emir" }
]
license = "MIT"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "accelerate>=0.26.0",
    "scipy (>=1.18.1,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
]

[tool.poetry]
package-mode = false

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
ignore = [
    "E501",
    "B008",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"